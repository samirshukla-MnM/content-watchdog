name: Content Monitor

on:
  schedule:
    # Daily at 03:00 UTC = 08:30 IST. Change this line to change the schedule.
    - cron: '0 3 * * *'
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

permissions:
  contents: write           # needed to commit the updated snapshot database

concurrency:
  group: content-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run content check
        env:
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:         ${{ secrets.SMTP_FROM }}
          ALERT_RECIPIENTS:  ${{ secrets.ALERT_RECIPIENTS }}
          SCHEDULE_LABEL:    scheduled
          WATCHDOG_DB:       data/watchdog.db
        run: python -m core.monitor

      - name: Commit updated snapshots
        run: |
          git config user.name  "content-watchdog"
          git config user.email "actions@github.com"
          git add -f data/watchdog.db
          git diff --staged --quiet || git commit -m "snapshots: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash || true
          git push
